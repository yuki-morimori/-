<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="robots" content="noindex" />
<title>らくらく手配 — 配車表エディタ プロトタイプ</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root{
    --bg:#f4f6f8; --panel:#fff; --line:#dce1e6; --ink:#1f2933; --sub:#6b7785;
    --blue:#2f6fed; --green:#1f9d57; --red:#e0413a; --yellow:#e7a400; --orange:#e8772e;
    --shadow:0 1px 3px rgba(0,0,0,.12);
    --chip-fs:13px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  body[data-fs="l"]{--chip-fs:17px}
  body[data-fs="xl"]{--chip-fs:22px}
  input{-webkit-user-select:text;user-select:text}
  svg{width:14px;height:14px;vertical-align:-2px;display:inline-block}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;position:sticky;top:0;z-index:20}
  .htop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .htop h1{font-size:15px;margin:0;font-weight:700}
  .navbtn{border:none;background:none;font-size:18px;color:var(--blue);cursor:pointer;padding:0 4px;line-height:1}
  .date{font-weight:700;color:var(--blue);min-width:74px;text-align:center}
  .total{font-size:12px;color:var(--sub)}
  .selinfo{font-size:12px;color:var(--blue);font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .selinfo a{cursor:pointer;text-decoration:underline}
  .selinfo .sbtn{padding:3px 8px;border:1px solid var(--blue);background:#eef4ff;color:var(--blue);border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
  .toolbtn{padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;cursor:pointer}
  .toolbtn:disabled{opacity:.4;cursor:default}
  .toolbtn.mode{border-color:var(--blue);color:var(--blue);font-weight:700}
  .toolbtn.view{border-color:var(--green);color:var(--green);font-weight:700}
  .toolbtn.xls{border-color:#1f7a44;color:#1f7a44;font-weight:700}
  .toolbtn.fs{border-color:#7b54d6;color:#7b54d6;font-weight:700}
  .presence{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:12px;color:var(--sub)}
  .ava{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:11px;border:2px solid #fff;box-shadow:0 0 0 1px var(--green)}
  .alertbar{margin-top:6px;font-size:13px;display:flex;gap:12px;flex-wrap:wrap;color:var(--sub)}
  .alertbar b{color:var(--red)}
  .ok{color:var(--green)!important}
  .legend{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .legend .tag{cursor:pointer;font-size:12px!important}
  .legend .tag.off{opacity:.35}

  main{display:grid;grid-template-columns:230px 1fr 180px;gap:10px;padding:10px;align-items:start}
  @media(max-width:880px){ main{grid-template-columns:1fr} }
  .col{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-height:120px}
  .col h2{font-size:12px;margin:0;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--sub);position:sticky;top:0;background:var(--panel);border-radius:10px 10px 0 0}
  .poolbar{padding:6px 8px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .poolbar input[type=text]{flex:1;min-width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px}
  .poolbar label{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:3px;white-space:nowrap;cursor:pointer}
  .pool,.vpool{padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
  .pool-empty{padding:8px;color:var(--sub);font-size:12px}

  .chip{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;background:#fff;border:2px solid #9aa5b1;font-size:var(--chip-fs);font-weight:600;cursor:pointer;touch-action:none;white-space:nowrap;line-height:1;-webkit-touch-callout:none}
  .bdg{display:inline-flex}
  .chip.placed{opacity:.4}
  .chip.dim{opacity:.18}
  .chip.sel{box-shadow:0 0 0 2px var(--blue), 0 0 0 4px rgba(47,111,237,.25);}
  .chip[data-border="blue"]{border-color:var(--blue)}
  .chip[data-border="yellow"]{border-color:var(--yellow);background:#fff8e6}
  .chip[data-border="orange"]{border-color:var(--orange);background:#fff3ea}
  .chip.veh{border-color:#5b6673;background:#eef1f4;color:#3a444f}
  .chip.dragging{opacity:.45}
  .floating{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;will-change:transform;box-shadow:0 6px 18px rgba(0,0,0,.28)}
  .gcount{background:var(--blue);color:#fff;border-radius:999px;padding:1px 6px;margin-left:4px;font-size:11px}

  .board{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .board-table{padding:10px;overflow-x:auto}
  .card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;touch-action:pan-y}
  .card.drop-hi{outline:2px dashed var(--blue);outline-offset:-2px}
  .card h3{margin:0;padding:7px 9px;font-size:13px;background:#f0f3f7;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .card h3 .title{font-weight:700}
  .card h3 .chip.veh{font-size:11px;padding:3px 7px;font-weight:600}
  .card .meta{padding:5px 9px;font-size:11px;color:var(--sub);border-bottom:1px dashed var(--line)}
  .count{margin-left:auto;font-size:12px;font-weight:700;color:var(--green)}
  .count.short{color:var(--red)}
  .slots{padding:8px;display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
  .warn{margin:0 9px 8px;font-size:11px;color:var(--red);font-weight:700}
  .empty-slot{font-size:11px;color:var(--red)}
  .empty-day{padding:24px;text-align:center;color:var(--sub);font-size:13px}
  .pool.drop-hi,.vpool.drop-hi{outline:2px dashed var(--blue);outline-offset:-4px}

  .dtable{border-collapse:collapse;width:100%;font-size:12px;background:#fff}
  .dtable th,.dtable td{border:1px solid var(--line);padding:5px 6px;vertical-align:top;text-align:left}
  .dtable th{background:#f0f3f7;color:var(--sub);font-size:11px;white-space:nowrap;position:sticky;top:0;z-index:1}
  .dtable td.c-site{white-space:nowrap;font-weight:700;position:sticky;left:0;background:#fff;z-index:1}
  .dtable th:first-child{position:sticky;left:0;z-index:3;background:#f0f3f7}
  .dtable td.c-mem .chip{margin:2px}
  .dtable .cnt{font-weight:700;color:var(--green);margin-right:4px;white-space:nowrap}
  .dtable .cnt.short{color:var(--red)}
  .dtable td.c-mem{min-width:170px}
  .dtable .cellin{width:100%;min-width:54px;border:1px solid transparent;background:transparent;font-size:12px;padding:3px 4px;border-radius:4px;font-family:inherit}
  .dtable .cellin:focus{border-color:var(--blue);background:#fff;outline:none}
  .dtable tr.drop-hi td{background:#eaf2ff}
  .dtable td.c-warn,.dtable .c-warn{color:var(--red);font-weight:700;white-space:nowrap;font-size:11px}
  @media(max-width:700px){ .dtable{font-size:11px} .dtable th,.dtable td{padding:4px} .dtable td.c-mem{min-width:130px} }

  button.add{margin:8px;padding:8px 10px;border:1px dashed #9aa5b1;background:#fff;border-radius:8px;color:var(--sub);font-size:13px;cursor:pointer;width:calc(100% - 16px)}
  .hint{padding:0 12px 14px;color:var(--sub);font-size:11px;line-height:1.5}
  .proto-note{margin:0 10px 12px;padding:8px 10px;background:#fffbe6;border:1px solid #f0e0a0;border-radius:8px;font-size:11px;color:#7a6a1f}

  .menu{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:200px;max-width:250px;max-height:320px;overflow-y:auto}
  .menu.hidden{display:none}
  .menu .mhead{padding:8px 12px;font-size:12px;color:var(--sub);font-weight:700;border-bottom:1px solid var(--line);background:#f7f9fb;position:sticky;top:0}
  .menu button{display:block;width:100%;text-align:left;padding:12px;border:none;background:#fff;font-size:14px;cursor:pointer;border-bottom:1px solid #f0f3f6}
  .menu button:active{background:#f0f6ff}
  .menu button.mdel{color:var(--red);font-weight:700}
  .menu .mempty{padding:12px;color:var(--sub);font-size:13px}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:100}
  .modal.hidden{display:none}
  .sheet{background:#fff;width:100%;max-width:460px;border-radius:14px 14px 0 0;padding:16px;max-height:88vh;overflow:auto}
  @media(min-width:560px){.modal{align-items:center}.sheet{border-radius:14px}}
  .sheet h3{margin:0 0 4px;font-size:16px}
  .sheet label{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px;font-weight:700}
  .sheet input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px}
  .ptags{display:flex;gap:8px;flex-wrap:wrap}
  .ptag{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;cursor:pointer}
  .ptag.on{border-color:var(--blue);background:#eef4ff;color:var(--blue);font-weight:700}
  .sug{border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;max-height:170px;overflow:auto}
  .sug:empty{display:none}
  .sug div{padding:9px 10px;font-size:14px;cursor:pointer;border-top:1px solid #eef1f4}
  .sug div .rb{color:var(--sub);font-size:11px;margin-left:6px}
  .sug div.new{color:var(--blue);font-weight:700}
  .sug div:active{background:#f0f6ff}
  .stepper{display:flex;align-items:center;gap:16px}
  .stepper button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:#f7f9fb;font-size:22px;cursor:pointer;line-height:1}
  .stepper span{font-size:22px;font-weight:700;min-width:36px;text-align:center}
  .actions{display:flex;gap:10px;margin-top:20px}
  .actions button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer}
  .actions .primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>らくらく手配</h1>
    <button class="navbtn" id="prevDay">◀</button>
    <span class="date" id="dateLbl">—</span>
    <button class="navbtn" id="nextDay">▶</button>
    <span class="total" id="total"></span>
    <span class="selinfo" id="selinfo"></span>
    <button class="toolbtn fs" id="fsBtn">文字:標準</button>
    <button class="toolbtn" id="undoBtn">↶ 戻す</button>
    <button class="toolbtn view" id="viewBtn">表で見る</button>
    <button class="toolbtn mode" id="modeBtn">かんたん操作</button>
    <button class="toolbtn xls" id="excelBtn">Excel出力</button>
    <button class="toolbtn" id="copyPrev">前日コピー</button>
    <button class="toolbtn" id="exportBtn">保存</button>
    <button class="toolbtn" id="importBtn">復元</button>
    <button class="toolbtn" id="resetAll">初期化</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <div class="presence"><span class="ava">山</span><span class="ava" style="background:#7b54d6;box-shadow:0 0 0 1px #7b54d6">佐</span> 編集中</div>
  </div>
  <div class="alertbar" id="alertbar"></div>
  <div class="legend" id="legend"></div>
</header>

<main>
  <section class="col">
    <h2>人員プール</h2>
    <div class="poolbar">
      <input type="text" id="poolSearch" placeholder="名前で検索" />
      <label><input type="checkbox" id="poolUnassigned"> 未配置のみ</label>
    </div>
    <div class="pool" id="pool" data-drop="pool"></div>
    <button class="add" id="addPerson">＋ 人員を追加</button>
  </section>

  <section class="col">
    <h2>配車フィールド</h2>
    <div class="proto-note"><b>文字:標準/大/特大</b>で人名を拡大（張り出し・掲示用）。<b>カード/表</b>切替・<b>Excel出力</b>で罫線つき.xlsx。<b>↶戻す</b>で取り消し。自動保存。</div>
    <div class="board" id="board"></div>
    <button class="add" id="addSite">＋ 現場カードを追加</button>
    <div class="hint">日付 ◀ ▶ で別の日へ。<b>前日コピー</b>で前日を複製。表ビューで集合・内容・メモを直接編集できます。</div>
  </section>

  <section class="col">
    <h2>車両プール</h2>
    <div class="vpool" id="vpool" data-drop="vpool"></div>
    <button class="add" id="addVeh">＋ 車両を追加</button>
  </section>
</main>

<div class="menu hidden" id="menu"></div>

<div class="modal hidden" id="siteModal">
  <div class="sheet">
    <h3>現場を追加</h3>
    <label>取引先（会社名）— 読み（かな）でも検索できます</label>
    <input id="fClient" autocomplete="off" placeholder="例: た → 高城総業" />
    <div class="sug" id="clientSug"></div>
    <label>現場名 — 下の過去一覧から選ぶ／新規入力</label>
    <input id="fSite" autocomplete="off" placeholder="例: み → 南青山2" />
    <div class="sug" id="siteSug"></div>
    <label>必要人数</label>
    <div class="stepper"><button id="needMinus">−</button><span id="needVal">3</span><button id="needPlus">＋</button></div>
    <div class="actions"><button id="siteCancel">キャンセル</button><button id="siteOk" class="primary">追加する</button></div>
  </div>
</div>

<div class="modal hidden" id="personModal">
  <div class="sheet">
    <h3>人員を追加</h3>
    <label>名前</label>
    <input id="pName" autocomplete="off" placeholder="例: 田中" />
    <label>属性（タップで選択・複数可）</label>
    <div class="ptags" id="pTags">
      <button class="ptag" data-tag="driver">運転可</button>
      <button class="ptag" data-tag="newbie">新人</button>
      <button class="ptag" data-tag="leader">リーダー</button>
      <button class="ptag" data-tag="helper">応援</button>
    </div>
    <div class="actions"><button id="pCancel">キャンセル</button><button id="pOk" class="primary">追加する</button></div>
  </div>
</div>

<div class="modal hidden" id="vehModal">
  <div class="sheet">
    <h3>車両を追加</h3>
    <label>車両名（名前だけでOK）</label>
    <input id="vName" autocomplete="off" placeholder="例: 1号車 / プリウス" />
    <div class="actions"><button id="vCancel">キャンセル</button><button id="vOk" class="primary">追加する</button></div>
  </div>
</div>

<script>
const SVG = {
  truck:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>`,
  car:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>`,
  star:`<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
  helper:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>`,
};
const TAGS = {
  driver:{label:"運転可",svg:SVG.car,border:"blue",color:"var(--blue)"},
  newbie:{label:"新人",svg:"",border:"yellow",color:"var(--yellow)"},
  leader:{label:"リーダー",svg:SVG.star,border:"blue",color:"var(--blue)"},
  helper:{label:"応援",svg:SVG.helper,border:"orange",color:"var(--orange)"},
};
const READING={
 "大崎建設":"おおさきけんせつ","高城総業":"たかぎそうぎょう","大和栄建":"だいわえいけん","クラレ":"くられ",
 "高鋼工業":"こうこうこうぎょう","カマブ":"かまぶ","松振組":"まつふりぐみ","旺城資材":"おうじょうしざい",
 "鈴田工作所":"すずたこうさくしょ","橘建設":"たちばなけんせつ","宮澤建設":"みやざわけんせつ","戸沢":"とざわ","JFE":"じぇいえふいー","(株)BONUS":"ぼーなす",
 "豊岡":"とよおか","三軒茶屋":"さんげんぢゃや","河之島":"かわのしま","小寺":"こでら","豊田":"とよた",
 "南青山2":"みなみあおやま","青山":"あおやま","富洋":"ふよう","神橋":"かんばし","千石":"せんごく",
 "大島田":"おおしまだ","池辺町":"いこのべちょう","行田":"ぎょうだ","さくら工業":"さくらこうぎょう","城端":"じょうはな",
};
const SEED = [
 {c:"大崎建設",n:"",v:"7405",t:"4:50",w:"土木",m:[["坂元",1],["斉藤",0],["大道",0]]},
 {c:"高城総業",n:"豊岡",v:"7406",t:"5:15",w:"解体",send:1,m:[["平野",1],["猿田",0],["北林",0],["古谷",0],["大井川",0],["川島",0],["富音",0],["仲登2名",2]]},
 {c:"高城総業",n:"三軒茶屋",v:"外注車",t:"5:15",w:"解体",send:1,m:[["石川悟",1],["八田",0],["井上雄",0],["井上",0]]},
 {c:"高城総業",n:"河之島",v:"7404",t:"5:15",w:"解体 GS/CCUS",m:[["木下",1],["柳田",0],["阿部",0],["安藤",0],["寺重",0],["トウケン",2]]},
 {c:"高城総業",n:"小寺",v:"",t:"5:15",w:"解体",m:[["松元",0]]},
 {c:"高城総業",n:"豊田",v:"7404",t:"5:15",w:"解体",send:1,m:[["一条",1],["仙叟",0]]},
 {c:"高城総業",n:"",v:"代車",t:"5:15",w:"解体 名簿",send:1,m:[["岩村",1],["越後谷",0],["笹岡",0],["菅",0]]},

 {c:"高城総業",n:"青山",v:"4102",t:"5:15",w:"解体 GS/CCUS",m:[["島田",1],["大沢",0],["石川眞",0],["久田",0],["菅原仁",0]]},
 {c:"大和栄建",n:"富洋",v:"アクア",t:"5:20",w:"廷場",m:[["松給",1],["中宮",0]]},

function buildSeedState(){
  const people=[],vehicles=[],clientMaster=[],siteMaster=[],sites=[],asg={};
  let pid=0,vid=0;const vmap={},cset=new Set(),sset=new Set();
  SEED.forEach((s,i)=>{
    const sid="s"+(i+1);
    sites.push({id:sid,client:s.c,name:s.n,time:s.t,content:s.w,need:s.m.length,needVehicle:!!s.v,note:s.note||"",send:s.send});
    asg[sid]={members:[],vehicles:[]};
    s.m.forEach(([nm,tg])=>{const id="p"+(++pid);people.push({id,name:nm,tags:tg===1?["driver"]:tg===2?["helper"]:[]});asg[sid].members.push(id);});
    if(s.v){if(!vmap[s.v]){vmap[s.v]={id:"v"+(++vid),name:s.v};vehicles.push(vmap[s.v]);}asg[sid].vehicles.push(vmap[s.v].id);}
    if(!cset.has(s.c)){cset.add(s.c);clientMaster.push({name:s.c,reading:READING[s.c]||""});}
    if(s.n&&!sset.has(s.n)){sset.add(s.n);siteMaster.push({name:s.n,reading:READING[s.n]||""});}
  });
  OFF.forEach(nm=>people.push({id:"p"+(++pid),name:nm+"(休)",tags:[]}));
  HOSP.forEach(nm=>people.push({id:"p"+(++pid),name:nm+"(入院)",tags:[]}));
  return {people,vehicles,clientMaster,siteMaster,days:{[SEED_DATE]:{sites,asg}},currentDate:SEED_DATE,mode:"easy",view:"card",fontScale:"s"};
}

  ws.mergeCells(1,9,2,9); C(1,9).value="名";
  ws.mergeCells(1,10,2,10); C(1,10).value="出発/時刻";
  ws.mergeCells(1,11,2,11); C(1,11).value="内容";
  ws.mergeCells(1,12,2,12); C(1,12).value="携帯";
  ws.mergeCells(1,13,2,13); C(1,13).value="日報";
  for(let c=1;c<=13;c++){C(1,c).font={bold:true};C(1,c).alignment={vertical:"middle",horizontal:"center"};C(2,c).alignment={vertical:"middle",horizontal:"center"};C(2,c).font={bold:true};}
  let r=3;
  sites.forEach(s=>{
    const a=asg[s.id];
    const mem=a.members.map(pid=>byId(people,pid)?.name).filter(Boolean);
    const veh=a.vehicles.map(vid=>byId(vehicles,vid)?.name).filter(Boolean);
    const chunks=[]; for(let i=0;i<mem.length;i+=5)chunks.push(mem.slice(i,i+5)); if(!chunks.length)chunks.push([]);
    const start=r, end=r+chunks.length;
    ws.mergeCells(start,1,end,2); C(start,1).value=s.client; C(start,1).font={bold:true}; C(start,1).alignment={vertical:"middle",horizontal:"center"};
    ws.mergeCells(start,3,end,3); C(start,3).value=s.name||""; C(start,3).alignment={vertical:"middle",horizontal:"center"};
    ws.mergeCells(start,11,end,11); C(start,11).value=s.content||""; C(start,11).alignment={vertical:"middle"};
    ws.mergeCells(start,12,end,12);
    ws.mergeCells(start,13,end,13); C(start,13).value=s.note||""; C(start,13).alignment={vertical:"middle",horizontal:"center"};
    veh.forEach((vn,i)=>{ if(i<5) C(start,5+i).value=vn; });
    C(start,10).value=s.time||"";
    chunks.forEach((ch,ci)=>{const rr=start+1+ci; if(ci===0){C(rr,4).value=a.members.length;C(rr,4).alignment={horizontal:"center"};} ch.forEach((nm,j)=>{C(rr,5+j).value=nm;C(rr,5+j).font={size:14};});});
    r=end+1;
  });
  const lastGrid=r-1;
  for(let rr=1;rr<=lastGrid;rr++)for(let cc=1;cc<=13;cc++)C(rr,cc).border=bd;
  r+=1;
  C(r,1).value="決定数"; C(r,2).value=assigned; C(r,3).value="名"; r++;
  C(r,1).value="待機"; C(r,2).value=Math.max(0,people.length-assigned-rest.length-hosp.length); C(r,3).value="名"; r++;

  vehicles.forEach((v,i)=>{C(2+i,17).value=v.name;});

const byId=(arr,id)=>arr.find(x=>x.id===id);
const $=id=>document.getElementById(id);
function personSites(pid){return sites.filter(s=>asg[s.id]?.members.includes(pid));}
function vehicleSites(vid){return sites.filter(s=>asg[s.id]?.vehicles.includes(vid));}
function siteHasDriver(sid){return (asg[sid]?.members||[]).some(pid=>byId(people,pid)?.tags.includes("driver"));}
function repBorder(p){if(p.tags.includes("helper"))return "orange";if(p.tags.includes("newbie"))return "yellow";if(p.tags.includes("driver")||p.tags.includes("leader"))return "blue";return "";}
function badges(p){return p.tags.map(t=>TAGS[t].svg?`<span class="bdg" style="color:${TAGS[t].color}">${TAGS[t].svg}</span>`:"").join("");}

function chipPerson(p,{inPool=false,siteId=null}={}){
  if(!p)return "";
  const placed=personSites(p.id).length>0, dup=personSites(p.id).length>1;
  const dimByFilter=filterTag&&!p.tags.includes(filterTag);
  const cls=["chip"];if(inPool&&placed)cls.push("placed");if(dimByFilter)cls.push("dim");if(selected.has(p.id))cls.push("sel");
  const dupMark=(dup&&siteId)?' <span style="color:var(--red)">⚠</span>':'';
  return `<span class="${cls.join(' ')}" data-border="${repBorder(p)}" data-type="person" data-id="${p.id}" data-from="${inPool?'pool':siteId}">${esc(p.name)}${badges(p)}${dupMark}</span>`;
}
function chipVehicle(v,{inPool=false,siteId=null}={}){
  if(!v)return "";
  const placed=vehicleSites(v.id).length>0;const cls=["chip","veh"];if(inPool&&placed)cls.push("placed");
  return `<span class="${cls.join(' ')}" data-type="vehicle" data-id="${v.id}" data-from="${inPool?'vpool':siteId}"><span class="bdg">${SVG.truck}</span>${esc(v.name)}</span>`;
}

function poolPeople(){
  let l=people;
  if(unassignedOnly)l=l.filter(p=>personSites(p.id).length===0);
  if(searchQuery){const q=searchQuery.toLowerCase();l=l.filter(p=>p.name.toLowerCase().includes(q));}
  return l;
}
function renderPool(){
  const l=poolPeople();
  $("pool").innerHTML = l.length? l.map(p=>chipPerson(p,{inPool:true})).join("") : `<div class="pool-empty">該当する人がいません</div>`;
}

function renderCardsHtml(){
  return sites.map(s=>{
    const a=asg[s.id]||{members:[],vehicles:[]};
    const short=a.members.length<s.need;
    const memberChips=a.members.map(pid=>chipPerson(byId(people,pid),{siteId:s.id})).join("");
    const vehChips=a.vehicles.map(vid=>chipVehicle(byId(vehicles,vid),{siteId:s.id})).join("");
    const emptySlots=short?`<span class="empty-slot">＋空き${s.need-a.members.length}（欠員！）</span>`:"";
    const warns=[];if(a.vehicles.length>0&&!siteHasDriver(s.id))warns.push("⚠ 車両ありなのに運転手なし");
    const meta=`集合 ${esc(s.time)||"-"} ・${esc(s.content)||"-"}${s.send?" ・送り":""}${s.note?" ・"+esc(s.note):""}`;
    return `<div class="card" data-drop="${s.id}">
      <h3><span class="title">${esc(s.client)}${s.name?" / "+esc(s.name):""}</span>${vehChips}<span class="count ${short?'short':''}">${a.members.length}/${s.need}${short?'':' ✓'}</span></h3>
      <div class="meta">${meta}</div>
      <div class="slots">${memberChips}${emptySlots}</div>
      ${warns.map(w=>`<div class="warn">${w}</div>`).join("")}
    </div>`;
  }).join("");
}
function renderTableHtml(){
  let h=`<table class="dtable"><thead><tr><th>現場</th><th>車</th><th>集合</th><th>内容</th><th>人員</th><th>メモ</th></tr></thead><tbody>`;
  h+=sites.map(s=>{
    const a=asg[s.id]||{members:[],vehicles:[]};
    const short=a.members.length<s.need;
    const mem=a.members.map(pid=>chipPerson(byId(people,pid),{siteId:s.id})).join(" ");
    const veh=a.vehicles.map(vid=>chipVehicle(byId(vehicles,vid),{siteId:s.id})).join(" ");
    const nodrv=a.vehicles.length>0&&!siteHasDriver(s.id);
    return `<tr data-drop="${s.id}">
      <td class="c-site">${esc(s.client)}${s.name?"<br>"+esc(s.name):""}</td>
      <td>${veh}${nodrv?'<div class="c-warn">運転手なし</div>':''}</td>
      <td><input class="cellin" data-edit="time" data-site="${s.id}" value="${esc(s.time)}" placeholder="--:--"></td>
      <td><input class="cellin" data-edit="content" data-site="${s.id}" value="${esc(s.content)}" placeholder="内容"></td>
      <td class="c-mem"><span class="cnt ${short?'short':''}">${a.members.length}/${s.need}</span>${mem}${short?' <span class="empty-slot">欠員</span>':''}</td>
      <td><input class="cellin" data-edit="note" data-site="${s.id}" value="${esc(s.note)}" placeholder="メモ"></td>
    </tr>`;
  }).join("");
  h+=`</tbody></table>`;
  return h;
}

function render(){
  applyFs();
  $("dateLbl").textContent=dispDate(currentDate);
  $("modeBtn").textContent = state.mode==="pro"?"サクサク操作":"かんたん操作";
  $("viewBtn").textContent = state.view==="table"?"カードで見る":"表で見る";
  $("undoBtn").disabled = undoStack.length===0;
  $("legend").innerHTML = Object.entries(TAGS).map(([k,t])=>
    `<span class="chip tag ${filterTag&&filterTag!==k?'off':''}" data-border="${t.border}" data-tag="${k}">${t.svg?`<span class="bdg" style="color:${t.color}">${t.svg}</span>`:''}${t.label}</span>`).join("");
  renderPool();
  $("vpool").innerHTML = vehicles.map(v=>chipVehicle(v,{inPool:true})).join("");
  const board=$("board");
  board.className = state.view==="table"?"board-table":"board";
  board.innerHTML = sites.length? (state.view==="table"?renderTableHtml():renderCardsHtml())
    : `<div class="empty-day">この日の配車はまだありません。<br>「前日コピー」または「＋現場カードを追加」で作成できます。</div>`;
  let lack=0,dup=new Set(),nodrv=0,assigned=0;
  sites.forEach(s=>{const a=asg[s.id];assigned+=a.members.length;if(a.members.length<s.need)lack++;if(a.vehicles.length>0&&!siteHasDriver(s.id))nodrv++;});
  people.forEach(p=>{if(personSites(p.id).length>1)dup.add(p.id);});
  const parts=[];
  parts.push(lack?`欠員: <b>${lack}現場</b>`:`<span class="ok">欠員なし</span>`);
  parts.push(nodrv?`運転手不在: <b>${nodrv}現場</b>`:`<span class="ok">運転手OK</span>`);
  parts.push(dup.size?`重複配置: <b>${dup.size}名</b>`:`<span class="ok">重複なし</span>`);
  $("alertbar").innerHTML="アラート ▸ "+parts.join(" / ");
  $("total").textContent=`配置 ${assigned}名 / ${sites.length}現場`;
  $("selinfo").innerHTML = selected.size? `${selected.size}名選択 <button class="sbtn" data-sact="move">現場へ移す</button><button class="sbtn" data-sact="pool">プールへ</button><a id="clearsel">解除</a>` : "";
  save();
}

function autoScrollTick(){

}

function startChip(e,chip){
  e.preventDefault();
  const type=chip.dataset.type,id=chip.dataset.id,from=chip.dataset.from;
  const startX=e.clientX,startY=e.clientY;
  let started=false,swiping=false,decided=false;
  let timer=setTimeout(beginDrag,LONGPRESS);
  function beginDrag(){
    started=true;
    let ids=[id],group=false;
    if(type==="person"&&selected.has(id)&&selected.size>1){ids=[...selected];group=true;}
    const f=chip.cloneNode(true);f.classList.add("floating");f.classList.remove("placed","dim","sel");f.style.transform="";f.style.opacity="";
    if(group)f.innerHTML+=`<span class="gcount">${ids.length}</span>`;
    document.body.appendChild(f);chip.classList.add("dragging");
    drag={type,id,ids,group,from,float:f,fx:startX,fy:startY,raf:0,scrollRaf:0};paintFloat();
    drag.scrollRaf=requestAnimationFrame(autoScrollTick);
  }
  function onMove(ev){
    if(started){ev.preventDefault();drag.fx=ev.clientX;drag.fy=ev.clientY;scheduleFloat();highlightAt(ev.clientX,ev.clientY);return;}
    const dx=ev.clientX-startX,dy=ev.clientY-startY;
    if(swiping){ev.preventDefault();setSwipe(chip,dx);return;}
    if(!decided&&Math.hypot(dx,dy)>10){decided=true;clearTimeout(timer);if(Math.abs(dx)>Math.abs(dy)+4){swiping=true;ev.preventDefault();setSwipe(chip,dx);}}
  }
  function onUp(ev){
    clearTimeout(timer);
    document.removeEventListener("pointermove",onMove);document.removeEventListener("pointerup",onUp);
    const dx=ev.clientX-startX,dy=ev.clientY-startY;
    if(started){
      if(drag.raf)cancelAnimationFrame(drag.raf);
      if(drag.scrollRaf)cancelAnimationFrame(drag.scrollRaf);
      const target=findDropTarget(ev.clientX,ev.clientY);
      drag.float.remove();chip.classList.remove("dragging");clearHi();
      if(target){pushUndo();applyDrop(drag,target);}drag=null;return;
    }
    if(swiping){ if(Math.abs(dx)>FLICK_DX)commitChipFlick(Math.sign(dx)); else snapBack(chip); return; }
    if(Math.hypot(dx,dy)<10){
      if(type==="person"&&(state.mode==="pro"||selected.size>0)){ selected.has(id)?selected.delete(id):selected.add(id); render(); return; }
      const r=chip.getBoundingClientRect(); openMenu(type,id,from,r.left,r.bottom);
    }
  }
  function commitChipFlick(dir){
    const inSite=(from!=="pool"&&from!=="vpool");
    if(inSite){ pushUndo(); slideOut(chip,dir,()=>{pull(from,type,id);render();}); return; }
    const label=type==="person"?("「"+(byId(people,id)?.name||"")+"」"):("車両「"+(byId(vehicles,id)?.name||"")+"」");
    if(confirm(label+"を削除しますか？")){ pushUndo(); slideOut(chip,dir,()=>{deleteRecord(type,id);render();}); }
    else snapBack(chip);
  }
  document.addEventListener("pointermove",onMove,{passive:false});
  document.addEventListener("pointerup",onUp);
}

function startCard(e,card){
  const sid=card.dataset.drop, startX=e.clientX,startY=e.clientY;
  let swiping=false,decided=false;
  function onMove(ev){
    const dx=ev.clientX-startX,dy=ev.clientY-startY;
    if(swiping){ev.preventDefault();setSwipe(card,dx);return;}
    if(!decided&&Math.hypot(dx,dy)>12){decided=true;if(Math.abs(dx)>Math.abs(dy)+6){swiping=true;ev.preventDefault();setSwipe(card,dx);}}
  }
  function onUp(ev){
    document.removeEventListener("pointermove",onMove);document.removeEventListener("pointerup",onUp);
    if(!swiping)return;
    const dx=ev.clientX-startX;
    if(Math.abs(dx)>CARD_FLICK_DX){
      const s=byId(sites,sid);
      if(s&&confirm("現場「"+s.client+(s.name?" / "+s.name:"")+"」を削除しますか？")){ pushUndo(); slideOut(card,Math.sign(dx),()=>{const i=sites.findIndex(x=>x.id===sid);if(i>=0)sites.splice(i,1);delete asg[sid];render();}); }
      else snapBack(card);
    } else snapBack(card);
  }
  document.addEventListener("pointermove",onMove,{passive:false});
  document.addEventListener("pointerup",onUp);
}

let menuCtx=null;
function closeMenu(){$("menu").classList.add("hidden");$("menu").innerHTML="";menuCtx=null;}
function openMenu(type,id,from,x,y){
  const inSite=(from!=="pool"&&from!=="vpool");
  menuCtx={type,id,from,inSite,group:false,ids:[id]};
  renderMenuRoot();
  const m=$("menu");m.classList.remove("hidden");
  const w=230,vw=window.innerWidth,vh=window.innerHeight;
  m.style.left=Math.max(8,Math.min(x,vw-w-8))+"px";
  m.style.top=Math.max(8,Math.min(y+6,vh-300))+"px";
}
function openGroupMoveMenu(anchor){
  const ids=[...selected];if(!ids.length)return;
  menuCtx={type:"person",id:ids[0],from:"-",inSite:false,group:true,ids};
  renderMenuSites();
  const m=$("menu");m.classList.remove("hidden");
  const r=anchor.getBoundingClientRect();
  m.style.left=Math.max(8,Math.min(r.left,window.innerWidth-238))+"px";
  m.style.top=(r.bottom+6)+"px";
}
function renderMenuRoot(){
  const c=menuCtx;
  const who=c.type==="person"?(byId(people,c.id)?.name||""):("車両 "+(byId(vehicles,c.id)?.name||""));
  let h=`<div class="mhead">${esc(who)}</div>`;
  if(c.inSite){
    h+=`<button data-act="return">人員プールに戻す</button>`;
    h+=`<button data-act="movesub">別の現場へ移す ▸</button>`;
  }else{
    h+=`<button data-act="movesub">現場へ配置 ▸</button>`;
  }
  if(c.type==="person") h+=`<button data-act="seltoggle">${selected.has(c.id)?"選択から外す":"選択に追加"}</button>`;
  if(!c.inSite) h+=`<button class="mdel" data-act="delete">削除</button>`;
  $("menu").innerHTML=h;
}
function renderMenuSites(){
  const c=menuCtx;
  let h=`<div class="mhead">${c.group?"選択中 "+c.ids.length+"名を移す先":"移す先を選ぶ"}</div>`;
  const list=sites.filter(s=>!(c.inSite&&s.id===c.from));
  if(list.length) h+=list.map(s=>`<button data-act="moveto" data-site="${s.id}">${esc(s.client)}${s.name?" / "+esc(s.name):""}</button>`).join("");
  else h+=`<div class="mempty">移せる現場がありません</div>`;
  $("menu").innerHTML=h;
}
$("menu").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!menuCtx)return;const c=menuCtx,a=b.dataset.act;
  if(a==="return"){pushUndo();applyDrop({type:c.type,id:c.id,ids:c.ids,group:c.group,from:c.from},c.type==="person"?"pool":"vpool");closeMenu();}
  else if(a==="movesub"){renderMenuSites();}
  else if(a==="moveto"){pushUndo();applyDrop({type:c.type,id:c.id,ids:c.ids,group:c.group,from:c.from},b.dataset.site);closeMenu();}
  else if(a==="seltoggle"){selected.has(c.id)?selected.delete(c.id):selected.add(c.id);render();closeMenu();}
  else if(a==="delete"){const who=c.type==="person"?byId(people,c.id)?.name:("車両 "+byId(vehicles,c.id)?.name);if(confirm(who+"を削除しますか？")){pushUndo();c.ids.forEach(x=>deleteRecord(c.type,x));render();}closeMenu();}
});

function deleteRecord(type,id){
  if(type==="person"){const i=people.findIndex(x=>x.id===id);if(i>=0)people.splice(i,1);Object.values(state.days).forEach(d=>Object.values(d.asg).forEach(a=>{a.members=a.members.filter(x=>x!==id);}));selected.delete(id);}
  else{const i=vehicles.findIndex(x=>x.id===id);if(i>=0)vehicles.splice(i,1);Object.values(state.days).forEach(d=>Object.values(d.asg).forEach(a=>{a.vehicles=a.vehicles.filter(x=>x!==id);}));}
}
function pull(sid,type,id){if(!asg[sid])return;if(type==="person")asg[sid].members=asg[sid].members.filter(x=>x!==id);else asg[sid].vehicles=asg[sid].vehicles.filter(x=>x!==id);}
function push(sid,type,id){if(type==="person"){if(!asg[sid].members.includes(id))asg[sid].members.push(id);}else{if(!asg[sid].vehicles.includes(id))asg[sid].vehicles.push(id);}}
function applyDrop(d,target){
  const toSite=sites.find(s=>s.id===target), toPool=(target==="pool"||target==="vpool");
  if(!toSite&&!toPool){render();return;}
  d.ids.forEach(id=>{
    if(d.group){sites.forEach(s=>pull(s.id,d.type,id));}
    else if(d.from!=="pool"&&d.from!=="vpool"&&d.from!==target){pull(d.from,d.type,id);}
    if(toSite)push(target,d.type,id);
  });
  if(d.group)selected.clear();
  render();
}

$("board").addEventListener("change",e=>{const i=e.target.closest(".cellin");if(!i)return;const s=byId(sites,i.dataset.site);if(!s)return;pushUndo();s[i.dataset.edit]=i.value;save();$("undoBtn").disabled=false;});

let needVal=3, capClient="", capSite="";
const normq=x=>(x||"").toLowerCase().trim();
function matchList(list,q){q=normq(q);if(!q)return list.slice(0,8);return list.filter(e=>normq(e.name).includes(q)||normq(e.reading).includes(q)).slice(0,8);}
function renderSug(which){
  const input=which==="client"?$("fClient"):$("fSite");
  const list=which==="client"?clientMaster:siteMaster;
  const box=which==="client"?$("clientSug"):$("siteSug");
  const q=input.value;
  let html=matchList(list,q).map(e=>`<div data-pick="${which}" data-name="${esc(e.name)}">${esc(e.name)}${e.reading?`<span class="rb">${esc(e.reading)}</span>`:""}</div>`).join("");
  if(q.trim()&&!list.some(e=>e.name===q.trim())) html+=`<div class="new" data-pick="${which}" data-name="${esc(q.trim())}">＋「${esc(q.trim())}」を新規登録</div>`;
  box.innerHTML=html;
}
function openSiteModal(){closeMenu();needVal=3;capClient="";capSite="";$("needVal").textContent="3";$("fClient").value="";$("fSite").value="";renderSug("client");renderSug("site");$("siteModal").classList.remove("hidden");setTimeout(()=>$("fClient").focus(),50);}
function closeSiteModal(){$("siteModal").classList.add("hidden");}
$("fClient").addEventListener("compositionupdate",e=>{if(e.data)capClient=e.data;});
$("fSite").addEventListener("compositionupdate",e=>{if(e.data)capSite=e.data;});
$("fClient").addEventListener("input",()=>renderSug("client"));
$("fSite").addEventListener("input",()=>renderSug("site"));
$("clientSug").addEventListener("click",e=>{const d=e.target.closest("[data-pick]");if(!d)return;$("fClient").value=d.dataset.name;renderSug("client");$("fSite").focus();});
$("siteSug").addEventListener("click",e=>{const d=e.target.closest("[data-pick]");if(!d)return;$("fSite").value=d.dataset.name;renderSug("site");});
$("needMinus").addEventListener("click",()=>{needVal=Math.max(1,needVal-1);$("needVal").textContent=needVal;});
$("needPlus").addEventListener("click",()=>{needVal++;$("needVal").textContent=needVal;});
$("siteCancel").addEventListener("click",closeSiteModal);
$("siteModal").addEventListener("click",e=>{if(e.target.id==="siteModal")closeSiteModal();});
$("siteOk").addEventListener("click",()=>{
  const client=$("fClient").value.trim(); if(!client){alert("取引先を入力してください");return;}
  const sname=$("fSite").value.trim();
  pushUndo();
  if(!clientMaster.some(e=>e.name===client))clientMaster.push({name:client,reading:capClient||""});
  if(sname&&!siteMaster.some(e=>e.name===sname))siteMaster.push({name:sname,reading:capSite||""});
  const id="s"+Date.now();
  sites.push({id,client,name:sname,content:"",time:"",note:"",need:needVal,needVehicle:false});asg[id]={members:[],vehicles:[]};
  closeSiteModal();render();
});

let pTagSel=new Set();
function openPersonModal(){closeMenu();$("pName").value="";pTagSel.clear();document.querySelectorAll("#pTags .ptag").forEach(b=>b.classList.remove("on"));$("personModal").classList.remove("hidden");setTimeout(()=>$("pName").focus(),50);}
$("pTags").addEventListener("click",e=>{const b=e.target.closest(".ptag");if(!b)return;const t=b.dataset.tag;if(pTagSel.has(t)){pTagSel.delete(t);b.classList.remove("on");}else{pTagSel.add(t);b.classList.add("on");}});
$("pCancel").addEventListener("click",()=>$("personModal").classList.add("hidden"));
$("personModal").addEventListener("click",e=>{if(e.target.id==="personModal")$("personModal").classList.add("hidden");});
$("pOk").addEventListener("click",()=>{const name=$("pName").value.trim();if(!name){alert("名前を入力してください");return;}pushUndo();people.push({id:"p"+Date.now(),name,tags:[...pTagSel]});$("personModal").classList.add("hidden");render();});

function openVehModal(){closeMenu();$("vName").value="";$("vehModal").classList.remove("hidden");setTimeout(()=>$("vName").focus(),50);}
$("vCancel").addEventListener("click",()=>$("vehModal").classList.add("hidden"));
$("vehModal").addEventListener("click",e=>{if(e.target.id==="vehModal")$("vehModal").classList.add("hidden");});
$("vOk").addEventListener("click",()=>{const name=$("vName").value.trim();if(!name){alert("車両名を入力してください");return;}pushUndo();vehicles.push({id:"v"+Date.now(),name});$("vehModal").classList.add("hidden");render();});

$("prevDay").addEventListener("click",()=>shiftDate(-1));
$("nextDay").addEventListener("click",()=>shiftDate(1));
$("fsBtn").addEventListener("click",toggleFs);
$("undoBtn").addEventListener("click",undo);
$("viewBtn").addEventListener("click",toggleView);
$("modeBtn").addEventListener("click",toggleMode);
$("excelBtn").addEventListener("click",exportXlsx);
$("copyPrev").addEventListener("click",copyPrev);
$("exportBtn").addEventListener("click",exportData);
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",e=>{const f=e.target.files[0];if(f)importData(f);e.target.value="";});
$("resetAll").addEventListener("click",resetAll);
$("legend").addEventListener("click",e=>{const t=e.target.closest("[data-tag]");if(!t)return;filterTag=filterTag===t.dataset.tag?null:t.dataset.tag;render();});
$("poolSearch").addEventListener("input",e=>{searchQuery=e.target.value;renderPool();});
$("poolUnassigned").addEventListener("change",e=>{unassignedOnly=e.target.checked;renderPool();});
$("selinfo").addEventListener("click",e=>{
  if(e.target.id==="clearsel"){selected.clear();render();closeMenu();return;}
  const b=e.target.closest("[data-sact]");if(!b)return;
  const ids=[...selected];if(!ids.length)return;
  if(b.dataset.sact==="pool"){pushUndo();applyDrop({type:"person",id:ids[0],ids,group:true,from:"-"},"pool");closeMenu();}
  else if(b.dataset.sact==="move"){openGroupMoveMenu(b);}
});
$("addPerson").addEventListener("click",openPersonModal);
$("addSite").addEventListener("click",openSiteModal);
$("addVeh").addEventListener("click",openVehModal);

applyFs();
render();
</script>
